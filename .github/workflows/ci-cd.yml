name: CI/CD

on:
  push:
  pull_request:

jobs:
  ci:
    name: Build and test Docker image 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check deployment script and Compose configuration
        run: |
          bash -n scripts/deploy-dashboard
          python3 -m unittest discover -s tests -v
          docker compose config -q

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            -t devopsintroduction:test \
            .

      - name: Run Docker container
        run: |
          docker run -d \
            --name devopsintroduction-test \
            -p 8080:80 \
            devopsintroduction:test

      - name: Test website
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/ > /tmp/dashboard.html
          grep -Fq 'DevOps Deployment Dashboard' /tmp/dashboard.html
          test "$(curl --fail http://localhost:8080/build-sha.txt)" = "${{ github.sha }}"

      - name: Stop Docker container
        if: always()
        run: docker rm -f devopsintroduction-test

  cd:
    name: Build and publish Docker image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            -t ghcr.io/zoplly/devoposintroduction:latest \
            -t ghcr.io/zoplly/devoposintroduction:sha-${{ github.sha }} \
            .

      - name: Test release image before publishing
        run: |
          docker run -d --name dashboard-release-test -p 8080:80 \
            ghcr.io/zoplly/devoposintroduction:sha-${{ github.sha }}
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/ > /tmp/dashboard-release.html
          grep -Fq 'DevOps Deployment Dashboard' /tmp/dashboard-release.html
          test "$(curl --fail http://localhost:8080/build-sha.txt)" = "${{ github.sha }}"

      - name: Stop release test container
        if: always()
        run: docker rm -f dashboard-release-test

      - name: Push Docker image
        run: |
          docker push ghcr.io/zoplly/devoposintroduction:latest
          docker push ghcr.io/zoplly/devoposintroduction:sha-${{ github.sha }}
