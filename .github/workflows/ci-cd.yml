name: CI/CD

on:
  push:
  pull_request:

jobs:
  ci:
    name: Build and test Docker image 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build \
            -t devopsintroduction:test \
            .

      - name: Run Docker container
        run: |
          docker run -d \
            --name devopsintroduction-test \
            -p 8080:80 \
            devopsintroduction:test

      - name: Test website
        run: |
          sleep 3
          curl --fail http://localhost:8080

      - name: Stop Docker container
        if: always()
        run: docker rm -f devopsintroduction-test

  cd:
    name: Build and publish Docker image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/zoplly/devoposintroduction:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/zoplly/devoposintroduction:latest

